# kernel-kasan.conf: shirudo-spike variant of the CI test kernel for
# shirudo (shield) validation. Merged after kernel-ci.conf with
#   testing/kernel/build-kernel.sh --fragment testing/kernel/kernel-kasan.conf
# Generic inline KASAN so a reproducer's memory corruption shows in dmesg,
# and KCOV for later coverage-guided fuzzing (syzkaller). Reports do not
# panic: the harness reads them from dmesg and keeps the VM.
CONFIG_LOCALVERSION="-shirudo-ci-kasan"
CONFIG_KASAN=y
CONFIG_KASAN_GENERIC=y
CONFIG_KASAN_INLINE=y
CONFIG_KASAN_VMALLOC=y
CONFIG_KCOV=y
CONFIG_KCOV_INSTRUMENT_ALL=y
CONFIG_KCOV_ENABLE_COMPARISONS=y
CONFIG_DEBUG_FS=y
CONFIG_STACKTRACE=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_PRINTK=y
CONFIG_BUG=y
# The size-optimised CI profile and KASAN together trip frame-size warnings.
CONFIG_FRAME_WARN=0
